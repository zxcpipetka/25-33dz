name: Deploy contact book

on:
  push:
    branches: [main]
    paths:
      - 'dz/29-30-31-32-33/**'
      - '.github/workflows/deploy-contact-book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dz/29-30-31-32-33/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dz/29-30-31-32-33

      - name: Lint
        run: npm run lint:js
        working-directory: dz/29-30-31-32-33

      - name: Build
        run: npm run build
        working-directory: dz/29-30-31-32-33

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dz/29-30-31-32-33/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4